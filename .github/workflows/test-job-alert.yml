name: Send BSO job alert preview

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Email address that should receive the test preview
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TEST_ALERT_RECIPIENT: ${{ inputs.recipient }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hide recipient from logs
        run: echo "::add-mask::$TEST_ALERT_RECIPIENT"

      - name: Send requested preview
        run: node --experimental-strip-types scripts/job-alert-preview.mjs
